name: ao-btp-copilot

services:
  # ── Moteur de génération locale (llama3.2:1b) ──────────────────────────
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  # ── Pré-chargement du modèle (s'arrête de lui-même après le pull) ──────
  preload:
    image: ollama/ollama:latest
    volumes:
      - ollama-models:/root/.ollama
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c", "ollama pull llama3.2:1b"]
    restart: "no"

  # ── L'application web (FastAPI + SPA React) ────────────────────────────
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      OLLAMA_HOST: http://ollama:11434
    volumes:
      - ./data:/app/data
    depends_on:
      ollama:
        condition: service_healthy
      preload:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  ollama-models: